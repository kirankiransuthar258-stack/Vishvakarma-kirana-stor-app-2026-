  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hindi);font-size:14px;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(22,115,74,.25);outline-offset:2px}.shell{max-width:1280px;margin:auto;min-height:100vh}.topbar{height:76px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(255,255,255,.72);position:sticky;top:0;z-index:4;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{height:40px;width:40px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800}.brand-title{font-size:16px;font-weight:800;line-height:1.4}.brand-sub{font-size:11px;color:var(--muted)}.top-right{display:flex;align-items:center;gap:12px}.online{font-size:12px;color:var(--green);display:flex;align-items:center;gap:7px}.online:before{content:'';width:7px;height:7px;border-radius:50%;background:#4aab68}.date-label{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 76px)}.sidebar{padding:28px 14px;border-right:1px solid var(--line);background:rgba(255,255,255,.27)}.nav-label{padding:0 13px 12px;color:#959a90;font-size:10px;font-weight:700;letter-spacing:1px}.nav-list{display:grid;gap:4px}.nav-btn{border:0;background:transparent;text-align:left;border-radius:9px;padding:11px 13px;display:flex;align-items:center;gap:12px;color:#61685e;font-weight:600;font-size:13px}.nav-btn .icon{width:19px;text-align:center;font-size:16px}.nav-btn.active{background:var(--green-wash);color:var(--green-dark)}.sidebar-note{position:sticky;top:calc(100vh - 160px);margin:34px 7px 0;padding:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.8}.main{padding:34px 40px 64px;min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--green);font-weight:700;margin-bottom:6px}.page-title{font-size:25px;line-height:1.3;letter-spacing:0;margin:0;font-weight:800}.page-hint{font-size:12px;color:var(--muted);margin-top:5px}.button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:39px;transition:background .16s,transform .16s}.button:active{transform:translateY(1px)}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green-dark)}.secondary{background:#edf0e9;color:var(--ink)}.danger{background:var(--red-wash);color:var(--red)}.small{min-height:32px;padding:7px 10px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{background:var(--white);padding:17px 18px;border:1px solid var(--line);border-radius:10px;min-height:111px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:600}.stat-icon{width:29px;height:29px;background:var(--green-wash);color:var(--green);border-radius:8px;display:grid;place-items:center;font-size:14px}.stat-value{font-size:24px;font-weight:800;margin-top:8px;line-height:1.25;letter-spacing:0}.stat-foot{font-size:10px;color:var(--muted);margin-top:3px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,.85fr);gap:14px}.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;min-width:0}.panel-head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.panel-title{font-size:14px;font-weight:800}.panel-sub{font-size:10px;color:var(--muted);margin-top:3px}.panel-body{padding:8px 18px 13px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:10px;color:#858b81;font-weight:600;padding:10px 9px;border-bottom:1px solid var(--line)}td{font-size:12px;padding:12px 9px;border-bottom:1px solid #f0f1ed}tbody tr:last-child td{border-bottom:0}.product-name{font-weight:700}.subline{font-size:10px;color:var(--muted);margin-top:3px}.money{font-family:var(--sans);font-variant-numeric:tabular-nums;font-weight:700}.stock-pill,.status-pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700;background:var(--green-wash);color:var(--green)}.stock-pill.low{background:var(--red-wash);color:var(--red)}.quick-actions{display:grid;gap:8px;padding:14px}.action-row{border:1px solid var(--line);background:#fff;text-align:left;padding:12px;display:flex;align-items:center;gap:11px;border-radius:8px}.action-row:hover{border-color:#a9cbb1}.action-ico{height:34px;width:34px;display:grid;place-items:center;border-radius:9px;background:var(--green-wash);color:var(--green);font-size:16px}.action-title{font-weight:700;font-size:12px}.action-desc{font-size:10px;color:var(--muted);margin-top:3px}.empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:12px}.empty-icon{font-size:23px;margin-bottom:8px}.toolbar{display:flex;gap:9px;margin-bottom:14px;align-items:center}.search{position:relative;flex:1;min-width:120px}.search input,.field input,.field select,.toolbar select{height:40px;width:100%;border:1px solid #dfe3d9;border-radius:8px;background:#fff;padding:0 12px;color:var(--ink);font-size:12px}.search input{padding-left:36px}.search:before{content:'⌕';position:absolute;top:9px;left:12px;color:#73796f;font-size:19px}.toolbar select{width:auto;min-width:140px}.table-panel{overflow:hidden}.table-panel .panel-body{padding:0 13px}.row-actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:7px;height:29px;width:31px;color:#5b6358}.icon-btn:hover{background:#f2f4ed}.two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,.7fr);gap:14px}.sale-products{display:grid;gap:7px;max-height:450px;overflow:auto;padding:12px}.sale-product{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}.sale-product:hover{border-color:#a5c9ac}.sale-product-name{font-size:12px;font-weight:700}.sale-product-meta{font-size:10px;color:var(--muted);margin-top:3px}.qty-control{display:flex;align-items:center;gap:9px}.qty-control button{border:1px solid var(--line);background:#f8f9f6;width:27px;height:27px;border-radius:7px;font-size:16px;color:var(--green);display:grid;place-items:center}.qty-number{font-family:var(--sans);font-size:12px;min-width:12px;text-align:center;font-weight:700}.cart-list{padding:8px 16px;max-height:225px;overflow:auto}.cart-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f1ed;font-size:11px}.cart-row:last-child{border-bottom:0}.cart-remove{border:0;background:none;color:#9a9f95;font-size:14px;padding:2px}.checkout-fields{display:grid;gap:10px;padding:12px 16px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:600}.field input,.field select{height:38px}.sale-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:14px 16px;font-weight:700}.sale-total strong{font-family:var(--sans);font-size:20px}.checkout{width:calc(100% - 32px);margin:0 16px 16px}.credit-note{font-size:10px;color:var(--amber);background:var(--amber-wash);padding:9px;border-radius:7px;line-height:1.6}.customer-cell{display:flex;align-items:center;gap:9px}.avatar{height:31px;width:31px;border-radius:50%;background:#e9eee5;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px}.balance{font-family:var(--sans);font-weight:700}.balance.owed{color:var(--red)}.filter-tabs{display:flex;gap:5px;background:#e9ece4;padding:4px;border-radius:8px}.filter-tabs button{border:0;background:transparent;border-radius:6px;padding:7px 10px;font-size:10px;color:var(--muted);font-weight:700}.filter-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #00000012}.modal-backdrop{position:fixed;inset:0;background:#171d18a6;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(100%,440px);background:#fff;border-radius:12px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:19px 21px;border-bottom:1px solid var(--line)}.modal-title{font-size:16px;font-weight:800}.close-btn{border:0;background:transparent;color:#777f73;font-size:22px}.modal-form{padding:19px 21px;display:grid;gap:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:5px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#202820;color:white;padding:11px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100vw - 32px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.history-list{padding:0 18px}.history-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.history-row:last-child{border:0}.history-main{font-size:12px;font-weight:700}.history-meta{font-size:10px;color:var(--muted);margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}.mobile-nav{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:900px){.topbar{padding:0 23px}.layout{grid-template-columns:180px minmax(0,1fr)}.sidebar{padding-left:9px;padding-right:9px}.main{padding:28px 24px 48px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.sidebar-note{position:static;margin-top:24px}}
    @media(max-width:640px){body{font-size:13px}.topbar{height:62px;padding:0 16px}.brand-mark{width:35px;height:35px}.brand-title{font-size:13px}.brand-sub{font-size:10px}.date-label{display:none}.online{font-size:10px}.layout{display:block;min-height:calc(100vh - 62px)}.sidebar{display:none}.main{padding:23px 15px 92px}.page-head{margin-bottom:18px}.page-title{font-size:21px}.page-head .button{padding:9px 10px;font-size:11px;white-space:nowrap}.stats{gap:8px;margin-bottom:13px}.stat{padding:12px;min-height:99px}.stat-value{font-size:21px}.stat-top{font-size:10px}.stat-icon{width:25px;height:25px}.dashboard-grid,.two-col{grid-template-columns:1fr;gap:11px}.panel-head{padding:13px 14px}.panel-body{padding-left:12px;padding-right:12px}.toolbar{flex-wrap:wrap}.toolbar select{flex:1;min-width:100px}.table-panel .panel-body{padding:0 7px}th{padding:9px 7px}td{padding:10px 7px;font-size:11px}.filter-tabs{width:100%}.filter-tabs button{flex:1}.two-col .sale-products{max-height:290px}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:5}.mobile-nav .nav-btn{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:5px 2px;border-radius:7px;font-size:9px;white-space:nowrap}.mobile-nav .nav-btn .icon{font-size:17px;width:auto}.toast{bottom:calc(75px + env(safe-area-inset-bottom))}.form-grid{gap:8px}.modal{max-height:calc(100vh - 32px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">वि</div><div><div class="brand-title">विष्वकर्मा किराना स्टोर</div><div class="brand-sub">पदराड़ा · आपका अपना स्टोर</div></div></div>
      <div class="top-right"><span class="online" id="connection-status">ऑफ़लाइन भी उपलब्ध</span><span class="date-label" id="today-label"></span></div>
    </header>
    <div class="layout">
      <aside class="sidebar"><div class="nav-label">मुख्य मेन्यू</div><nav class="nav-list" id="side-nav"></nav><div class="sidebar-note">आपका डेटा इसी डिवाइस में सुरक्षित रहता है। इंटरनेट न होने पर भी बिक्री जारी रखें।</div></aside>
      <main class="main" id="app"></main>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="मुख्य मेन्यू"></nav>
  <div id="modal-root"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      'use strict';
      const STORAGE_KEY='vishvakarma-kirana-v1';
      const navItems=[['home','⌂','डैशबोर्ड'],['sale','＋','बिक्री'],['products','▦','सामान'],['customers','♙','ग्राहक'],['reports','▤','हिसाब']];
      let db=loadDb(),page='home',productQuery='',customerQuery='',productFilter='all',reportFilter='today',cart={},toastTimer;
      function loadDb(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved&&Array.isArray(saved.products)&&Array.isArray(saved.customers)&&Array.isArray(saved.sales))return saved}catch(error){}return{products:[],customers:[],sales:[],payments:[]}}
      function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(error){notify('जगह कम है। डेटा का बैकअप लेकर कुछ जगह खाली करें।')}}
      const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const money=value=>'₹'+Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:2});
      const today=()=>new Date().toISOString().slice(0,10);
      const fmtDate=value=>{if(!value)return'';return new Date(value+'T00:00:00').toLocaleDateString('hi-IN',{day:'numeric',month:'short',year:'numeric'})};
      const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      function notify(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
      function navButton([id,icon,label]){return `<button class="nav-btn ${page===id?'active':''}" data-page="${id}" ${page===id?'aria-current="page"':''}><span class="icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`}
      function render(){document.getElementById('today-label').textContent=new Date().toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long'});document.getElementById('side-nav').innerHTML=navItems.map(navButton).join('');document.getElementById('mobile-nav').innerHTML=navItems.map(navButton).join('');const host=document.getElementById('app');host.innerHTML=({home:dashboard,sale:salesPage,products:productsPage,customers:customersPage,reports:reportsPage}[page])();bindPage();}
      function stat(label,value,icon,foot=''){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon" aria-hidden="true">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
      function heading(eyebrow,title,hint,button=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><div class="page-hint">${hint}</div></div>${button}</div>`}
      function dashboard(){const sold=db.sales.filter(s=>s.date===today());const revenue=sold.reduce((sum,s)=>sum+s.total,0);const outstanding=db.customers.reduce((sum,c)=>sum+Math.max(0,c.balance||0),0);const low=db.products.filter(p=>p.stock<=p.lowStock);const recent=[...db.sales].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);return `${heading('आज का कारोबार','नमस्ते, आपका स्टोर','आज की बिक्री और दुकान की स्थिति एक नज़र में',`<button class="button primary" data-go="sale">＋ नई बिक्री</button>`)}<section class="stats">${stat('आज की बिक्री',money(revenue),'₹',`${sold.length} बिल`)}${stat('आज के बिल',sold.length,'▤','आज बनाए गए')}${stat('ग्राहकों की उधारी',money(outstanding),'↗',`${db.customers.filter(c=>c.balance>0).length} बाकी खाते`)}${stat('कम स्टॉक',low.length,'!',low.length?'फिर से सामान भरें':'स्टॉक ठीक है')}</section><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">हाल की बिक्री</div><div class="panel-sub">आपके सबसे नए बिल</div></div><button class="button secondary small" data-go="reports">सभी देखें →</button></div>${recent.length?`<div class="panel-body"><div class="table-wrap"><table><thead><tr><th>बिल / ग्राहक</th><th>समय</th><th>भुगतान</th><th>रकम</th></tr></thead><tbody>${recent.map(s=>`<tr><td><div class="product-name">${esc(s.customerName||'खुदरा ग्राहक')}</div><div class="subline">#${esc(s.id.slice(-5).toUpperCase())}</div></td><td>${new Date(s.createdAt).toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'})}</td><td>${s.due>0?'<span class="stock-pill low">उधार</span>':'<span class="stock-pill">नकद</span>'}</td><td class="money">${money(s.total)}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="empty"><div class="empty-icon">▤</div>अभी कोई बिक्री नहीं हुई।<br>पहली बिक्री शुरू करें।</div>`}</section><section class="panel"><div class="panel-head"><div><div class="panel-title">जल्दी करें</div><div class="panel-sub">रोज़ के काम</div></div></div><div class="quick-actions"><button class="action-row" data-go="sale"><span class="action-ico">＋</span><span><span class="action-title">नई बिक्री जोड़ें</span><span class="action-desc" style="display:block">बिल बनाएँ और स्टॉक घटाएँ</span></span></button><button class="action-row" data-action="add-product"><span class="action-ico">▦</span><span><span class="action-title">नया सामान जोड़ें</span><span class="action-desc" style="display:block">भाव और स्टॉक दर्ज करें</span></span></button><button class="action-row" data-action="add-customer"><span class="action-ico">♙</span><span><span class="action-title">ग्राहक जोड़ें</span><span class="action-desc" style="display:block">उधारी का खाता बनाएँ</span></span></button></div></section></div><section class="panel" style="margin-top:14px"><div class="panel-head"><div><div class="panel-title">स्टॉक पर ध्यान दें</div><div class="panel-sub">कम सामान वाले उत्पाद</div></div><button class="button secondary small" data-go="products">सामान देखें →</button></div>${low.length?`<div class="panel-body"><div class="table-wrap"><table><thead><tr><th>सामान</th><th>श्रेणी</th><th>बचा हुआ</th><th>बिक्री भाव</th></tr></thead><tbody>${low.slice(0,5).map(p=>`<tr><td class="product-name">${esc(p.name)}</td><td>${esc(p.category||'अन्य')}</td><td><span class="stock-pill low">${p.stock} ${esc(p.unit)}</span></td><td class="money">${money(p.price)}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="empty">${db.products.length?'सभी सामान का स्टॉक ठीक है।':'पहले सामान जोड़ें, स्टॉक की जानकारी यहाँ दिखेगी।'}</div>`}</section>`}
      function productsPage(){const filtered=db.products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(productQuery.toLowerCase())&&(productFilter==='all'||(productFilter==='low'?p.stock<=p.lowStock:p.category===productFilter)));const cats=[...new Set(db.products.map(p=>p.category).filter(Boolean))];return `${heading('आपका स्टॉक','सामान और भाव','स्टॉक, बिक्री भाव और खरीद भाव संभालें',`<button class="button primary" data-action="add-product">＋ सामान जोड़ें</button>`)}<div class="toolbar"><div class="search"><input id="product-search" type="search" placeholder="सामान खोजें…" value="${esc(productQuery)}" aria-label="सामान खोजें"></div><select id="product-filter" aria-label="श्रेणी से छाँटें"><option value="all">सभी श्रेणियाँ</option><option value="low" ${productFilter==='low'?'selected':''}>कम स्टॉक</option>${cats.map(c=>`<option value="${esc(c)}" ${productFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><section class="panel table-panel"><div class="panel-head"><div><div class="panel-title">सामान की सूची <span class="subline" style="display:inline">(${filtered.length})</span></div></div></div>${filtered.length?`<div class="panel-body"><div class="table-wrap"><table><thead><tr><th>सामान</th><th>खरीद भाव</th><th>बिक्री भाव</th><th>स्टॉक</th><th>काम</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><div class="product-name">${esc(p.name)}</div><div class="subline">${esc(p.category||'अन्य')} · प्रति ${esc(p.unit)}</div></td><td class="money">${money(p.cost)}</td><td class="money">${money(p.price)}</td><td><span class="stock-pill ${p.stock<=p.lowStock?'low':''}">${p.stock} ${esc(p.unit)}</span></td><td><div class="row-actions"><button class="icon-btn" data-edit-product="${p.id}" aria-label="${esc(p.name)} बदलें" title="बदलें">✎</button><button class="icon-btn" data-stock="${p.id}" aria-label="${esc(p.name)} का स्टॉक बढ़ाएँ" title="स्टॉक बढ़ाएँ">＋</button><button class="icon-btn" data-delete-product="${p.id}" aria-label="${esc(p.name)} हटाए       function salesPage(){const items=db.products.filter(p=>p.stock>0);const entries=Object.entries(cart).filter(([id,q])=>db.products.some(p=>p.id===id)&&q>0);const total=entries.reduce((sum,[id,q])=>sum+db.products.find(p=>p.id===id).price*q,0);return `${heading('बिक्री','नई बिक्री','सामान चुनें, भुगतान दर्ज करें और बिल बनाएँ') }<div class="two-col"><section class="panel"><div class="panel-head"><div><div class="panel-title">सामान चुनें</div><div class="panel-sub">उपलब्ध स्टॉक: ${items.length} उत्पाद</div></div></div><div class="search" style="margin:12px 12px 0"><input id="sale-search" type="search" placeholder="सामान खोजें…" aria-label="बिक्री के लिए सामान खोजें"></div><div class="sale-products" id="sale-products">${items.length?items.map(p=>`<div class="sale-product" data-sale-product="${p.id}"><div><div class="sale-product-name">${esc(p.name)}</div><div class="sale-product-meta">${money(p.price)} / ${esc(p.unit)} · स्टॉक ${p.stock}</div></div><div class="qty-control"><button data-qty="${p.id}" data-delta="-1" aria-label="${esc(p.name)} घटाएँ">−</button><span class="qty-number">${cart[p.id]||0}</span><button data-qty="${p.id}" data-delta="1" aria-label="${esc(p.name)} जोड़ें">+</button></div></div>`).join(''):`<div class="empty">बिक्री शुरू करने के लिए पहले सामान जोड़ें।<br><button class="button secondary small" style="margin-top:10px" data-go="products">सामान जोड़ें</button></div>`}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">आज का बिल</div><div class="panel-sub">${entries.reduce((sum,[,q])=>sum+q,0)} सामान</div></div><button class="button secondary small" data-action="clear-cart">साफ़ करें</button></div><div class="cart-list">${entries.length?entries.map(([id,q])=>{const p=db.products.find(x=>x.id===id);return `<div class="cart-row"><span>${esc(p.name)} × ${q}</span><span class="money">${money(p.price*q)}</span><button class="cart-remove" data-remove-cart="${id}" aria-label="${esc(p.name)} हटाएँ">×</button></div>`}).join(''):`<div class="empty" style="padding:22px 0">सामान चुनने पर बिल यहाँ दिखेगा।</div>`}</div><div class="checkout-fields"><div class="field"><label for="sale-customer">ग्राहक (उधारी के लिए चुनें)</label><select id="sale-customer"><option value="">खुदरा ग्राहक</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}${c.balance>0?' · बाकी '+money(c.balance):''}</option>`).join('')}</select></div><div class="field"><label for="sale-paid">अभी मिले रुपये</label><input id="sale-paid" type="number" min="0" step="0.01" placeholder="${total.toFixed(2)}" value="${total?total.toFixed(2):''}"></div><div id="credit-preview"></div></div><div class="sale-total"><span>कुल रकम</span><strong>${money(total)}</strong></div><button class="button primary checkout" data-action="checkout" ${entries.length?'':'disabled'}>बिक्री पूरी करें</button></section></div>`}
      function customersPage(){const filtered=db.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(customerQuery.toLowerCase()));const due=db.customers.reduce((sum,c)=>sum+Math.max(0,c.balance||0),0);return `${heading('ग्राहक खाते','उधारी का हिसाब',`कुल बाकी ${money(due)} · ${db.customers.length} ग्राहक`,`<button class="button primary" data-action="add-customer">＋ ग्राहक जोड़ें</button>`)}<div class="toolbar"><div class="search"><input id="customer-search" type="search" placeholder="नाम या मोबाइल से खोजें…" value="${esc(customerQuery)}" aria-label="ग्राहक खोजें"></div></div><section class="panel table-panel"><div class="panel-head"><div><div class="panel-title">ग्राहक सूची <span class="subline" style="display:inline">(${filtered.length})</span></div></div></div>${filtered.length?`<div class="panel-body"><div class="table-wrap"><table><thead><tr><th>ग्राहक</th><th>फोन</th><th>बाकी उधारी</th><th>काम</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><div class="customer-cell"><span class="avatar">${esc(c.name.trim().charAt(0)||'ग्र')}</span><span><span class="product-name">${esc(c.name)}</span><span class="subline">खाता ${fmtDate(c.createdDate)}</span></span></div></td><td>${esc(c.phone||'—')}</td><td><span class="balance ${c.balance>0?'owed':''}">${money(c.balance)}</span></td><td><div class="row-actions">${c.balance>0?`<button class="button secondary small" data-payment="${c.id}">रुपये लें</button>`:''}<button class="icon-btn" data-edit-customer="${c.id}" aria-label="${esc(c.name)} बदलें" title="बदलें">✎</button><button class="icon-btn" data-delete-customer="${c.id}" aria-label="${esc(c.name)} हटाएँ" title="हटाएँ">×</button></div></td></tr>`).join('')}</tbody></table></div></div>`:`<div class="empty"><div class="empty-icon">♙</div>${customerQuery?'कोई ग्राहक नहीं मिला।':'अभी ग्राहक खाते नहीं हैं।'}<br><button class="button primary small" style="margin-top:12px" data-action="add-customer">＋ ग्राहक जोड़ें</button></div>`}</section><section class="panel" style="margin-top:14px"><div class="panel-head"><div><div class="panel-title">हाल की वसूली</div><div class="panel-sub">ग्राहकों से मिले रुपये</div></div></div>${db.payments.length?`<div class="history-list">${[...db.payments].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5).map(p=>`<div class="history-row"><div><div class="history-main">${esc(p.customerName)}</div><div class="history-meta">${fmtDate(p.date)}${p.note?' · '+esc(p.note):''}</div></div><strong class="money positive">+${money(p.amount)}</strong></div>`).join('')}</div>`:`<div class="empty">अभी कोई भुगतान दर्ज नहीं है।</div>`}</section>`}
      function reportsPage(){let selected=db.sales.filter(s=>reportFilter==='all'||(reportFilter==='today'?s.date===today():s.date>=new Date(Date.now()-6*86400000).toISOString().slice(0,10)));selected.sort((a,b)=>b.createdAt-a.createdAt);const total=selected.reduce((sum,s)=>sum+s.total,0);return `${heading('बिक्री का रिकॉर्ड','हिसाब-किताब','बिल, नकद बिक्री और उधारी का पूरा रिकॉर्ड')}<section class="stats">${stat('कुल बिक्री',money(total),'₹',reportFilter==='today'?'आज':'चुनी गई अवधि')}${stat('बिल',selected.length,'▤','इस अवधि में')}${stat('नकद मिला',money(selected.reduce((sum,s)=>sum+s.paid,0)),'↓','बिक्री पर मिला')}${stat('नई उधारी',money(selected.reduce((sum,s)=>sum+s.due,0)),'↗','बिक्री पर बाकी')}</section><section class="panel table-panel"><div class="panel-head"><div><div class="panel-title">बिक्री के बिल</div><div class="panel-sub">हर बिक्री का विवरण</div></div><div class="filter-tabs"><button data-report-filter="today" class="${reportFilter==='today'?'active':''}">आज</button><button data-report-filter="week" class="${reportFilter==='week'?'active':''}">7 दिन</button><button data-report-filter="all" class="${reportFilter==='all'?'active':''}">सभी</button></div></div>${selected.length?`<div class="panel-body"><div class="table-wrap"><table><thead><tr><th>तारीख / बिल</th><th>ग्राहक</th><th>सामान</th><th>कुल</th><th>मिला</th><th>बाकी</th></tr></thead><tbody>${selected.map(s=>`<tr><td><div>${fmtDate(s.date)}</div><div class="subline">#${esc(s.id.slice(-5).toUpperCase())}</div></td><td>${esc(s.customerName||'खुदरा ग्राहक')}</td><td>${s.items.reduce((sum,i)=>sum+i.qty,0)} आइटम</td><td class="money">${money(s.total)}</td><td class="money">${money(s.paid)}</td><td class="money ${s.due?'negative':''}">${money(s.due)}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="empty"><div class="empty-icon">▤</div>इस अवधि में कोई बिक्री नहीं है।</div>`}</section>`}
      function bindPage(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.page)));document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.go)));document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>actions[el.dataset.action]?.()));document.querySelectorAll('[data-edit-product]').forEach(el=>el.addEventListener('click',()=>productModal(el.dataset.editProduct)));document.querySelectorAll('[data-delete-product]').forEach(el=>el.addEventListener('click',()=>deleteProduct(el.dataset.deleteProduct)));document.querySelectorAll('[data-stock]').forEach(el=>el.addEventListener('click',()=>stockModal(el.dataset.stock)));document.querySelectorAll('[data-edit-customer]').forEach(el=>el.addEventListener('click',()=>customerModal(el.dataset.editCustomer)));document.querySelectorAll('[data-delete-customer]').forEach(el=>el.addEventListener('click',()=>deleteCustomer(el.dataset.deleteCustomer)));document.querySelectorAll('[data-payment]').forEach(el=>el.addEventListener('click',()=>paymentModal(el.dataset.payment)));document.querySelectorAll('[data-qty]').forEach(el=>el.addEventListener('click',()=>changeQty(el.dataset.qty,Number(el.dataset.delta))));document.querySelectorAll('[data-remove-cart]').forEach(el=>el.addEventListener('click',()=>{delete cart[el.dataset.removeCart];render()}));document.querySelectorAll('[data-report-filter]').forEach(el=>el.addEventListener('click',()=>{reportFilter=el.dataset.reportFilter;render()}));const ps=document.getElementById('product-search');if(ps)ps.addEventListener('input',e=>{productQuery=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('product-search');next.focus();next.setSelectionRange(pos,pos)});const pf=document.getElementById('product-filter');if(pf)pf.addEventListener('change',e=>{productFilter=e.target.value;render()});const cs=document.getElementById('customer-search');if(cs)cs.addEventListener('input',e=>{customerQuery=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('customer-search');next.focus();next.setSelectionRange(pos,pos)});const ss=document.getElementById('sale-search');if(ss)ss.addEventListener('input',()=>{const query=ss.value.toLowerCase();document.querySelectorAll('[data-sale-product]').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(query)?'':'none'})});const paid=document.getElementById('sale-paid');if(paid)paid.addEventListener('input',updateCreditPreview);const cust=document.getElementById('sale-customer');if(cust)cust.addEventListener('change',updateCreditPreview)}
      function navigate(target){page=target;render();window.scrollTo({top:0,behavior:'smooth'})}
      function changeQty(id,delta){const product=db.products.find(p=>p.id===id);if(!product)return;const next=(cart[id]||0)+delta;if(next>product.stock){notify('उपलब्ध स्टॉक से ज़्यादा नहीं जोड़ सकते।');return}if(next<=0)delete cart[id];else cart[id]=next;render()}
      function updateCreditPreview(){const select=document.getElementById('sale-customer'),paid=document.getElementById('sale-paid'),host=document.getElementById('credit-preview');if(!select||!paid||!host)return;const total=Object.entries(cart).reduce((sum,[id,q])=>sum+(db.products.find(p=>p.id===id)?.price||0)*q,0);const amount=Math.max(0,Number(paid.value)||0);const due=Math.max(0,total-amount);host.innerHTML=due>0?`<div class="credit-note">${select.value?'इस बिक्री में '+money(due)+' ग्राहक के खाते में जुड़ेंगे।':'बाकी रकम के लिए ग्राहक चुनें; बिना ग्राहक के उधारी दर्ज नहीं होगी।'}</div>`:amount>total?'<div class="credit-note">मिले रुपये कुल रकम से अधिक नहीं हो सकते।</div>':''}
      function checkout(){const entries=Object.entries(cart).filter(([,q])=>q>0);if(!entries.length){notify('बिल में सामान जोड़ें।');return}const total=entries.reduce((sum,[id,q])=>sum+db.products.find(p=>p.id===id).price*q,0);const paidInput=document.getElementById('sale-paid');const paid=paidInput.value===''?total:Number(paidInput.value);const customerId=document.getElementById('sale-customer').value;const customer=db.customers.find(c=>c.id===customerId);if(!Number.isFinite(paid)||paid<0||paid>total){notify('मिली रकम कुल से कम या बराबर रखें।');return}if(total-paid>0&&!customer){notify('उधारी के लिए ग्राहक चुनें।');return}for(const [id,q] of entries){const p=db.products.find(x=>x.id===id);if(!p||p.stock<q){notify('स्टॉक बदल गया है। बिल जाँचें।');render();return}}const sale={id:uid(),date:today(),createdAt:Date.now(),customerId:customer?.id||'',customerName:customer?.name||'',items:entries.map(([id,qty])=>{const p=db.products.find(x=>x.id===id);p.stock-=qty;return{productId:id,name:p.name,price:p.price,qty,unit:p.unit}}),total,paid,due:total-paid};db.sales.push(sale);if(customer&&sale.due){customer.balance=(customer.balance||0)+sale.due}save();cart={};page='home';render();notify(sale.due?`बिक्री सेव हुई · ${money(sale.due)} उधारी में जोड़ी`:'बिक्री सेव हुई।')}
      const actions={'add-product':()=>productModal(),'add-customer':()=>customerModal(),'checkout':checkout,'clear-cart':()=>{cart={};render()}};
      function openModal(title,body,onReady){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div class="modal-title">${title}</div><button class="close-btn" type="button" data-close aria-label="बंद करें">×</button></div>${body}</section></div>`;root.querySelector('[data-close]').onclick=closeModal;root.querySelector('[data-backdrop]').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});if(onReady)onReady()}
      function closeModal(){document.getElementById('modal-root').innerHTML=''}
      function productModal(id){const product=db.products.find(p=>p.id===id);const p=product||{name:'',category:'',unit:'पैकेट',cost:'',price:'',stock:'',lowStock:5};openModal(product?'सामान बदलें':'नया सामान जोड़ें',`<form class="modal-form" id="product-form"><div class="field"><label for="p-name">सामान का नाम *</label><input id="p-name" name="name" required maxlength="80" value="${esc(p.name)}" placeholder="जैसे: आटा 5 किलो"></div><div class="form-grid"><div class="field"><label for="p-category">श्रेणी</label><input id="p-category" name="category" maxlength="40" value="${esc(p.category)}" placeholder="राशन"></div><div class="field"><label for="p-unit">इकाई</label><input id="p-unit" name="unit" maxlength="20" value="${esc(p.unit)}" placeholder="पैकेट"></div><div class="field"><label for="p-cost">खरीद भाव (₹)</label><input id="p-cost" name="cost" type="number" min="0" step="0.01" value="${p.cost}" required></div><div class="field"><label for="p-price">बिक्री भाव (₹)</label><input id="p-price" name="price" type="number" min="0" step="0.01" value="${p.price}" required></div><div class="field"><label for="p-stock">मौजूदा स्टॉक</label><input id="p-stock" name="stock" type="number" min="0" step="any" value="${p.stock}" required></div><div class="field"><label for="p-low">कम स्टॉक की सीमा</label><input id="p-low" name="lowStock" type="number" min="0" step="any" value="${p.lowStock}" required></div></div><div class="form-actions"><button type="button" class="button secondary" data-close-form>रद्द करें</button><button class="button primary">${product?'बदलाव सेव करें':'सामान जोड़ें'}</button></div></form>`,()=>{document.getElementById('product-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const data={name:f.get('name').trim(),category:f.get('category').trim()||'अन्य',unit:f.get('unit').trim()||'पीस',cost:Number(f.get('cost')),price:Number(f.get('price')),stock:Number(f.get('stock')),lowStock:Number(f.get('lowStock'))};if(!data.name||![data.cost,data.price,data.stock,data.lowStock].every(Number.isFinite)){notify('सभी जरूरी जानकारी सही भरें।');return}if(product)Object.assign(product,data);else db.products.push({id:uid(),...data});save();closeModal();render();notify(product?'सामान बदल गया।':'सामान जोड़ दिया।')};document.querySelector('[data-close-form]').onclick=closeModal;document.getElementById('p-name').focus()})}
      function stockModal(id){const p=db.products.find(x=>x.id===id);if(!p)return;openModal('स्टॉक बढ़ाएँ',`<form class="modal-form" id="stock-form"><div class="credit-note">${esc(p.name)} · अभी ${p.stock} ${esc(p.unit)} मौजूद</div><div class="field"><label for="stock-add">कितना स्टॉक आया?</label><input id="stock-add" type="number" min="0.01" step="any" required placeholder="मात्रा"></div><div class="form-actions"><button type="button" class="button secondary" data-close-form>रद्द करें</button><button class="button primary">स्टॉक सेव करें</button></div></form>`,()=>{document.getElementById('stock-form').onsubmit=e=>{e.preventDefault();const n=Number(document.getElementById('stock-add').value);if(n<=0)return;p.stock+=n;save();closeModal();render();notify('स्टॉक बढ़ा दिया।')};document.querySelector('[data-close-form]').onclick=closeModal})}
      function deleteProduct(id){const p=db.products.find(x=>x.id===id);if(!p)return;if(!confirm(`“${p.name}” हटाएँ? पुरानी बिक्री के रिकॉर्ड सुरक्षित रहेंगे।`))return;db.products=db.products.filter(x=>x.id!==id);delete cart[id];save();render();notify('सामान हटा दिया।')}
      function customerModal(id){const customer=db.customers.find(c=>c.id===id);const c=customer||{name:'',phone:'',balance:0};openModal(customer?'ग्राहक बदलें':'नया ग्राहक',`<form class="modal-form" id="customer-form"><div class="field"><label for="c-name">ग्राहक का नाम *</label><input id="c-name" name="name" required maxlength="80" value="${esc(c.name)}" placeholder="पूरा नाम"></div><div class="field"><label for="c-phone">मोबाइल नंबर</label><input id="c-phone" name="phone" type="tel" inputmode="numeric" maxlength="15" value="${esc(c.phone)}" placeholder="मोबाइल नंबर"></div>${customer?`<div class="credit-note">बाकी उधारी: ${money(customer.balance)} · बैलेंस सीधे बदलने के बजाय रुपये लें से भुगतान दर्ज करें।</div>`:''}<div class="form-actions"><button type="button" class="button secondary" data-close-form>रद्द करें</button><button class="button primary">${customer?'बदलाव सेव करें':'ग्राहक जोड़ें'}</button></div></form>`,()=>{document.getElementById('customer-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=f.get('name').trim(),phone=f.get('phone').trim();if(!name){notify('ग्राहक का नाम भरें।');return}if(customer)Object.assign(customer,{name,phone});else db.customers.push({id:uid(),name,phone,balance:0,createdDate:today()});save();closeModal();render();notify(customer?'ग्राहक बदल गया।':'ग्राहक जोड़ दिया।')};document.querySelector('[data-close-form]').onclick=closeModal;document.getElementById('c-name').focus()})}
      function deleteCustomer(id){const c=db.customers.find(x=>x.id===id);if(!c)return;if(c.balance>0){notify('बाकी उधारी चुकाए बिना खाता नहीं हटा सकते।');return}if(!confirm(`“${c.name}” का खाता हटाएँ? पुरानी बिक्री सुरक्षित रहेगी।`))return;db.customers=db.customers.filter(x=>x.id!==id);save();render();notify('ग्राहक हटा दिया।')}
      function paymentModal(id){const c=db.customers.find(x=>x.id===id);if(!c||c.balance<=0)return;openModal('उधारी का भुगतान',`<form class="modal-form" id="payment-form"><div class="credit-note">${esc(c.name)} · बाकी ${money(c.balance)}</div><div class="field"><label for="pay-amount">आज मिले रुपये</label><input id="pay-amount" type="number" min="0.01" max="${c.balance}" step="0.01" required placeholder="रकम"></div><div class="field"><label for="pay-note">नोट (वैकल्पिक)</label><input id="pay-note" maxlength="80" placeholder="जैसे: नकद"></div><div class="form-actions"><button type="button" class="button secondary" data-close-form>रद्द करें</button><button class="button primary">भुगतान सेव करें</button></div></form>`,()=>{document.getElementById('payment-form').onsubmit=e=>{e.preventDefault();const amount=Number(document.getElementById('pay-amount').value),note=document.getElementById('pay-note').value.trim();if(!Number.isFinite(amount)||amount<=0||amount>c.balance){notify('रकम बाकी उधारी से ज़्यादा नहीं हो सकती।');return}c.balance=Math.max(0,Math.round((c.balance-amount)*100)/100);db.payments.push({id:uid(),customerId:c.id,customerName:c.name,amount,date:today(),createdAt:Date.now(),note});save();closeModal();render();notify(`${money(amount)} का भुगतान सेव हुआ।`)};document.querySelector('[data-close-form]').onclick=closeModal;document.getElementById('pay-amount').focus()})}
      document.addEventListener('online',()=>{const el=document.getElementById('connection-status');if(el)el.textContent='ऑफ़लाइन भी उपलब्ध'});document.addEventListener('offline',()=>{const el=document.getElementById('connection-status');if(el)el.textContent='ऑफ़लाइन मोड'});
      if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
      render();
    })();
  </script>
</body>
</html>
